<!doctype html>
<meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;background:#241f26;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="2560" height="1440" style="width:1280px;height:720px"></canvas>
<script type="module">
import { drawCharacter } from './js/render/character.js';
import { createCharacterSpec, PART_COUNTS } from './js/model/character.js';
const ctx = document.getElementById('c').getContext('2d');
ctx.scale(2,2);
ctx.fillStyle='#241f26'; ctx.fillRect(0,0,1280,720);
const base = {...createCharacterSpec(), top:0, topColor:8, bottom:2, bottomColor:9, build:2};
// Row 1: every shoe, bare legs.  Row 2: every sock, with flats.
for (let s = 0; s < PART_COUNTS.shoes; s++) {
  const x = 90 + s*150, y = 320;
  ctx.save(); ctx.translate(x, y); ctx.scale(0.85, 0.85);
  drawCharacter(ctx, {...base, shoes:s, shoesColor:8, socks:0}, 0);
  ctx.restore();
  ctx.fillStyle='#f4eee4'; ctx.font='14px system-ui'; ctx.textAlign='center';
  ctx.fillText('shoe '+s, x, y+22);
}
for (let k = 0; k < PART_COUNTS.socks; k++) {
  const x = 90 + k*150, y = 660;
  ctx.save(); ctx.translate(x, y); ctx.scale(0.85, 0.85);
  drawCharacter(ctx, {...base, shoes:0, shoesColor:9, socks:k, socksColor:8}, 0);
  ctx.restore();
  ctx.fillStyle='#f4eee4'; ctx.font='14px system-ui'; ctx.textAlign='center';
  ctx.fillText('sock '+k, x, y+22);
}
</script>
